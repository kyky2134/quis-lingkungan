
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Sejarah Indonesia</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇮🇩 Quiz Sejarah Indonesia</h1>
    <p class="subtitle">
        Uji pengetahuan sejarah bangsa Indonesia!
    </p>

    <div id="quiz">

        <div class="info">
            <span id="questionNumber">Soal 1/10</span>
            <span id="score">Skor: 0</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question" id="question"></div>

        <div id="options"></div>

        <div class="explanation" id="explanation"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Soal Berikutnya →
        </button>

    </div>

    <div id="result">
        <h2>🎉 Quiz Selesai!</h2>
        <p id="finalScore"></p>
        <p id="message"></p>
        <button onclick="restartQuiz()">Ulangi Quiz</button>
    </div>

</div>

<!-- Menghubungkan JavaScript -->
<script src="script.js"></script>

</body>
</html>
